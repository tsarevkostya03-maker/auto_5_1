name: Java CI with Gradle

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: List artifacts (для отладки)
        run: ls -la artifacts/

      - name: Start SUT
        run: |
          java -jar ./artifacts/app-card-delivery.jar &
          echo "Waiting for SUT..."
          for i in {1..30}; do
            if curl -s http://localhost:9999/ > /dev/null; then
              echo "SUT is ready!"
              break
            fi
            echo "Attempt $i: SUT not ready..."
            sleep 1
          done

      - name: Run tests
        run: ./gradlew test --info -Dselenide.headless=true
