name: Java CI with Gradle

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          
      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Check artifacts folder
        run: ls -la artifacts/

      - name: Start SUT
        run: |
          # Используем правильное имя файла (app-replan-delivery.jar)
          java -jar ./artifacts/app-replan-delivery.jar &
          sleep 5
          for i in {1..20}; do
            if curl -s http://localhost:9999/ > /dev/null; then
              echo "✅ SUT is ready! (attempt $i)"
              exit 0
            fi
            echo "⏳ Waiting for SUT... (attempt $i/20)"
            sleep 2
          done
          echo "❌ SUT failed to start after 40 seconds"
          exit 1

      - name: Run tests
        run: ./gradlew test --info -Dselenide.headless=true
